<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${rental.id != null} ? 'Editar alquiler' : 'Nuevo alquiler'">Nuevo alquiler</title>
    <link rel="stylesheet" th:href="@{/css/rentals/create.css}">
</head>
<body>

<main class="rental-page">
    <section class="page-heading">
        <a th:href="@{/rentals}" class="back-arrow">←</a>
        <div class="page-heading-text">
            <h1 th:text="${rental.id != null} ? 'Editar Alquiler' : 'Nuevo Alquiler'">Nuevo Alquiler</h1>
            <p>Completa los detalles del alquiler</p>
        </div>
    </section>

    <section class="content-layout">
        <div class="form-panel">
            <form th:action="@{/rentals/save}" th:object="${rental}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="form-group">
                    <label for="name">Nombre</label>
                    <input id="name" type="text" placeholder="Nombre">
                </div>

                <div class="form-group">
                    <label for="surname">Apellidos</label>
                    <input id="surname" type="text" placeholder="Apellidos">
                </div>

                <div class="form-group">
                    <label for="vehicle">Vehículo</label>
                    <select id="vehicle" name="vehicle.id" required>
                        <option value="" disabled selected>Seleccionar un vehículo</option>
                        <option th:each="v : ${vehicles}"
                                th:value="${v.id}"
                                th:text="${v.brand + ' ' + v.model}"
                                th:selected="${rental.vehicle != null and rental.vehicle.id == v.id}">
                        </option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group half">
                        <label for="startDate">Fecha Inicio</label>
                        <div class="input-with-icon">
                            <input id="startDate" type="date" th:field="*{startDate}" required>
                        </div>
                    </div>

                    <div class="form-group half">
                        <label for="estimatedReturnDate">Fecha de fin</label>
                        <div class="input-with-icon">
                            <input id="estimatedReturnDate" type="date" th:field="*{estimatedReturnDate}" required>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="price">Total (€)</label>
                    <input id="price" type="text" th:field="*{price}" placeholder="Calculado automáticamente" readonly>
                </div>

                <div class="form-group">
                    <label for="note">Notas</label>
                    <textarea id="note" th:field="*{note}" placeholder="Notas o requisitos especiales"></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Crear Alquiler</button>
                    <a th:href="@{/rentals}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>

        <div class="fleet-panel">
            <div class="fleet-header">
                <h2>Nuestra flota</h2>
                <p>Muestra de nuestros vehículos</p>
            </div>

            <div class="fleet-grid" th:if="${vehicles != null and !#lists.isEmpty(vehicles)}">
                <article class="vehicle-card" th:each="v : ${vehicles}">
                    <div class="vehicle-image">
                        <div class="vehicle-image-placeholder">Sin imagen</div>
                    </div>
                    <div class="vehicle-body">
                        <h3 th:text="${v.brand + ' ' + v.model}">Vehículo</h3>
                        <p th:text="${v.description != null and !#strings.isEmpty(v.description) ? v.description : 'Descripción no disponible'}">
                            Descripción del vehículo
                        </p>
                    </div>
                </article>
            </div>

            <div class="empty-fleet" th:if="${vehicles == null or #lists.isEmpty(vehicles)}">
                <p>No hay vehículos cargados todavía.</p>
            </div>
        </div>
    </section>
</main>

</body>
</html>
