                        <p style="margin:0; font-size:0.75rem; color:#88D4AB; font-weight:500;">by Code Bloom</p>
                    </div>
                </div>

                <!-- Usuario + logout -->
                <div style="display:flex; align-items:center; gap:10px;">
                    <div style="text-align:right;">
                        <p style="margin:0; font-size:0.875rem; color:#1F2937; font-weight:500;" th:text="${currentUser != null ? currentUser.name : 'Administrador'}">Administrador</p>

</html>
